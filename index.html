<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
<title>OMNIS — кабинет дилера</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Alumni+Sans:wght@500;600;700&family=Geist:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{--navy:#193E75;--dark:#111F32;--steel:#8992A3;--gb:#B6C1D5;--light:#ECECEC;--line:#D5D9E1;--muted:#5B6475;--ok:#1F6B44;--okbg:#E3F3EA;--wait:#7A4F00;--waitbg:#FFF1D6;--bad:#8C1D18;--badbg:#FDE7E6}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--light);color:var(--dark);font-family:'Geist',system-ui,sans-serif;font-size:15px}
button,input,textarea,select{font-family:inherit;font-size:inherit;color:inherit}
button{cursor:pointer}
.num{font-family:'Alumni Sans',sans-serif;font-weight:700;letter-spacing:.01em}
.h{font-family:'Alumni Sans',sans-serif;font-weight:700;text-transform:uppercase;letter-spacing:.02em;margin:0;line-height:1}
#app{max-width:520px;margin:0 auto;min-height:100vh;display:flex;flex-direction:column;padding-bottom:84px}
.top{background:var(--dark);color:#fff;padding:18px 20px 76px}
.top small{display:block;font-size:11px;letter-spacing:.16em;color:var(--gb);font-weight:600;margin-bottom:4px}
.top .h{font-size:30px}
.wrap{padding:0 16px;display:flex;flex-direction:column;gap:14px}
.lift{margin-top:-60px}
.card{background:#fff;border-radius:20px;padding:16px}
.debt{background:var(--navy);color:#fff;border-radius:22px;padding:20px;display:flex;flex-direction:column;gap:16px}
.debt .lbl{font-size:13px;color:var(--gb)}
.debt .big{font-size:56px;line-height:1}
.grid2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.grid3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.tile{border-radius:14px;padding:12px;display:flex;flex-direction:column;gap:2px}
.tile .t{font-size:12px}.tile .v{font-size:28px;line-height:1.1}.tile .s{font-size:11px}
.t-navy{background:#11305C;color:#fff}.t-navy .t,.t-navy .s{color:var(--gb)}
.t-red{background:#4A1620;color:#fff}.t-red .t,.t-red .s{color:#FFD0D4}
.t-green{background:#123F33;color:#fff}.t-green .t,.t-green .s{color:#BFE6D2}
.bar{height:6px;border-radius:3px;background:#11305C}.bar i{display:block;height:6px;border-radius:3px;background:var(--gb)}
.btn{height:52px;border-radius:16px;border:none;font-weight:600;font-size:15px;display:flex;align-items:center;justify-content:center;gap:8px;width:100%}
.btn-dark{background:var(--dark);color:#fff}.btn-navy{background:var(--navy);color:#fff}
.btn-light{background:#fff;border:1px solid var(--gb);color:var(--dark)}
.btn:disabled{opacity:.5}
.stat{background:#fff;border-radius:16px;padding:14px 16px}
.stat .t{font-size:12px;color:var(--muted)}.stat .v{font-size:26px}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chip{height:34px;padding:0 12px;border-radius:10px;border:1px solid var(--line);background:#fff;font-size:13px;font-weight:600;white-space:nowrap}
.chip.on{background:var(--navy);border-color:var(--navy);color:#fff}
.row{display:grid;grid-template-columns:minmax(0,1fr) auto auto;column-gap:12px;align-items:center;padding:10px 0;border-top:1px solid var(--light)}
.row .a{font-size:14px;font-weight:600}.row .b{font-size:12px;color:var(--muted)}
.row .s{font-size:20px;text-align:right;white-space:nowrap}.row .bal{font-size:18px;text-align:right;min-width:80px;color:var(--muted)}
.hdr{display:grid;grid-template-columns:minmax(0,1fr) auto auto;column-gap:12px;font-size:11px;color:var(--muted);letter-spacing:.06em;font-weight:600}
.plus{color:var(--dark)}.minus{color:var(--ok)}.pend{color:var(--wait)}
.badge{padding:5px 10px;border-radius:10px;font-size:12px;font-weight:600;white-space:nowrap;align-self:flex-start}
.b-ok{background:var(--okbg);color:var(--ok)}.b-wait{background:var(--waitbg);color:var(--wait)}.b-bad{background:var(--badbg);color:var(--bad)}
.act{display:flex;align-items:center;gap:14px;background:#fff;border-radius:18px;padding:14px 16px;border:none;width:100%;text-align:left}
.cal{width:52px;height:56px;border-radius:14px;background:var(--light);display:flex;flex-direction:column;align-items:center;justify-content:center;flex-shrink:0}
.cal b{font-family:'Alumni Sans',sans-serif;font-size:26px;line-height:1}.cal span{font-size:11px;font-weight:600;color:var(--muted)}
.page-h{padding:20px 20px 6px}.page-h .h{font-size:40px}.page-h p{margin:4px 0 0;font-size:13px;color:var(--muted)}
.back{display:flex;align-items:center;gap:6px;padding:12px 12px 4px 8px}
.back button{width:44px;height:44px;border:none;background:none;border-radius:22px;display:flex;align-items:center;justify-content:center}
.item{display:flex;justify-content:space-between;gap:12px;padding:11px 0;border-top:1px solid var(--light)}
.item .n{font-size:14px;font-weight:600;line-height:1.3}.item .d{font-size:12px;color:var(--muted);margin-top:3px}.item .s{font-size:20px;white-space:nowrap}
nav{position:fixed;left:0;right:0;bottom:0;background:#fff;border-top:1px solid var(--line);display:grid;grid-template-columns:repeat(4,1fr);padding:8px 8px calc(12px + env(safe-area-inset-bottom));max-width:520px;margin:0 auto;z-index:5}
nav button{border:none;background:none;display:flex;flex-direction:column;align-items:center;gap:4px;padding:6px 0;font-size:11px;font-weight:500;color:var(--muted)}
nav button.on{color:var(--navy);font-weight:700}
nav svg{width:22px;height:22px}
nav .bd{position:absolute;top:0;right:calc(50% - 22px);min-width:18px;height:18px;border-radius:9px;background:#C8102E;color:#fff;font-size:11px;font-weight:700;display:flex;align-items:center;justify-content:center;padding:0 5px}
nav button{position:relative}
.pill{padding:4px 10px;border-radius:8px;font-size:12px;font-weight:700;white-space:nowrap}
.field{display:flex;flex-direction:column;gap:8px}.field label,.field .lab{font-size:13px;font-weight:600}
.inp{height:50px;border-radius:14px;border:1px solid var(--gb);padding:0 14px;background:#fff;width:100%}
.inp.big{height:58px;font-family:'Alumni Sans',sans-serif;font-size:32px;font-weight:700}
textarea.inp{height:auto;padding:12px 14px;resize:none}
.drop{height:96px;border-radius:14px;border:1.5px dashed var(--steel);background:#F6F7F9;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;font-size:13px;font-weight:600;color:#3B4352;width:100%;overflow:hidden;position:relative}
.drop img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.prod{background:#fff;border-radius:16px;padding:10px 12px 10px 10px;display:flex;align-items:center;gap:12px}
.prod .br{font-size:11px;font-weight:700;color:var(--navy);letter-spacing:.06em}
.prod .nm{font-size:14px;font-weight:600;line-height:1.3}.prod .pr{font-size:12px;color:var(--muted)}
.add{width:44px;height:44px;border-radius:14px;border:1px solid var(--line);background:#fff;flex-shrink:0;display:flex;align-items:center;justify-content:center}
.step{display:flex;align-items:center;background:var(--dark);border-radius:14px;padding:2px;flex-shrink:0}
.step button{width:38px;height:40px;border:none;background:none;color:#fff;font-size:20px;font-weight:700}
.step input{width:40px;border:none;background:none;color:#fff;text-align:center;font-weight:700;font-size:15px;padding:0}
.thumb{width:60px;height:60px;border-radius:12px;background:#fff;object-fit:contain;flex-shrink:0;border:1px solid var(--light)}
.thumb.sm{width:44px;height:44px;border-radius:10px}
.catbtn{display:flex;align-items:center;justify-content:space-between;gap:8px;height:44px;border-radius:14px;border:1px solid var(--line);background:#fff;padding:0 14px;font-weight:600;font-size:14px;width:100%}
.sheet-bg{position:fixed;inset:0;background:rgba(17,31,50,.45);z-index:10;display:flex;align-items:flex-end;justify-content:center}
.sheet{background:#fff;border-radius:22px 22px 0 0;width:100%;max-width:520px;max-height:80vh;overflow:auto;padding:16px 16px calc(20px + env(safe-area-inset-bottom))}
.sheet .opt{display:flex;justify-content:space-between;align-items:center;width:100%;height:48px;border:none;background:none;border-bottom:1px solid var(--light);font-size:15px;font-weight:500;padding:0 4px;text-align:left}
.sheet .opt.on{color:var(--navy);font-weight:700}
.cart{position:fixed;left:0;right:0;bottom:calc(66px + env(safe-area-inset-bottom));max-width:520px;margin:0 auto;background:#fff;border-top:1px solid var(--line);border-radius:20px 20px 0 0;padding:12px 16px;display:flex;flex-direction:column;gap:8px;box-shadow:0 -6px 20px rgba(17,31,50,.08);z-index:4}
.search{display:flex;align-items:center;gap:8px;height:48px;border-radius:14px;background:#fff;border:1px solid var(--line);padding:0 14px}
.search input{border:none;outline:none;flex:1;background:transparent}
.center{display:flex;flex-direction:column;align-items:center;text-align:center;gap:14px;padding:60px 28px}
.muted{color:var(--muted)}.sm{font-size:12px}
.banner{background:var(--waitbg);color:var(--wait);font-size:13px;font-weight:600;padding:10px 16px;text-align:center}
.spin{width:28px;height:28px;border:3px solid var(--gb);border-top-color:var(--navy);border-radius:50%;animation:s 1s linear infinite}@keyframes s{to{transform:rotate(360deg)}}
.zoomable{cursor:zoom-in}
body.kb nav, body.kb .cart{display:none}
.lb{position:fixed;inset:0;z-index:20;background:rgba(10,18,30,.92);display:flex;flex-direction:column;align-items:center;justify-content:center;padding:24px 20px calc(24px + env(safe-area-inset-bottom));animation:lbIn .18s ease-out}
.lb img{width:min(90vw,520px);height:min(90vw,520px);object-fit:contain;background:#fff;border-radius:22px;box-shadow:0 20px 60px rgba(0,0,0,.4)}
.lb .cap{color:#fff;text-align:center;margin-top:16px;max-width:440px;display:flex;flex-direction:column;gap:4px}
.lb .cap b{font-size:16px;line-height:1.35}.lb .cap span{color:var(--gb);font-size:13px}
.lb .x{position:absolute;top:calc(14px + env(safe-area-inset-top));right:14px;width:44px;height:44px;border-radius:22px;border:none;background:rgba(255,255,255,.14);display:flex;align-items:center;justify-content:center}
.lb .hint{position:absolute;bottom:calc(18px + env(safe-area-inset-bottom));color:var(--steel);font-size:12px}
@keyframes lbIn{from{opacity:0}to{opacity:1}}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
</style>
</head>
<body>
<div id="app"><div class="center"><div class="spin" aria-label="Загрузка"></div></div></div>
<nav id="nav" hidden></nav>
<script>
const API = "https://nrszupwnnzlnfxeqrbnb.supabase.co/functions/v1/miniapp-api";
const tg = window.Telegram && Telegram.WebApp;
const S = { role:null, data:null, view:"home", period:"all", sel:null, catalog:null, cat:"Все", q:"", cart:{}, brand:"Все", adminDealers:null, dealerId:null, pay:{method:"Click"}, staff:null, counts:{}, ship:null, apay:{method:"Наличные"} };
try { S.cart = JSON.parse(localStorage.getItem("omnis_cart") || "{}") } catch (e) {}
const $ = (s) => document.querySelector(s);
const esc = (s) => String(s ?? "").replace(/[&<>"']/g, (c) => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const money = (n) => { const v = Math.round(Number(n || 0)); return (v < 0 ? "−" : "") + String(Math.abs(v)).replace(/\B(?=(\d{3})+(?!\d))/g, " ") };
const today = () => new Date(Date.now() + 5 * 3600e3).toISOString().slice(0, 10);
const dmy = (d) => { const [y, m, dd] = String(d).slice(0, 10).split("-"); return `${dd}.${m}.${y}` };
const dm = (d) => dmy(d).slice(0, 5);
const daysAgo = (d) => Math.round((Date.parse(today()) - Date.parse(String(d).slice(0, 10))) / 864e5);
const agoTxt = (d) => { const n = daysAgo(d); if (n <= 0) return "сегодня"; if (n === 1) return "вчера"; return `${n} ${plural(n, "день", "дня", "дней")} назад` };
const plural = (n, a, b, c) => { n = Math.abs(n) % 100; const n1 = n % 10; if (n > 10 && n < 20) return c; if (n1 > 1 && n1 < 5) return b; if (n1 === 1) return a; return c };
const MON = ["ЯНВ","ФЕВ","МАР","АПР","МАЙ","ИЮН","ИЮЛ","АВГ","СЕН","ОКТ","НОЯ","ДЕК"];
const haptic = (t = "light") => { try { tg.HapticFeedback.impactOccurred(t) } catch (e) {} };
const saveCart = () => { try { localStorage.setItem("omnis_cart", JSON.stringify(S.cart)) } catch (e) {} };

const ICON = {
  home: '<path d="M3 11l9-7 9 7v9a1 1 0 0 1-1 1h-5v-6H9v6H4a1 1 0 0 1-1-1z"/>',
  box: '<path d="M4 7l8-4 8 4v10l-8 4-8-4z"/><path d="M4 7l8 4 8-4M12 11v10"/>',
  card: '<rect x="3" y="6" width="18" height="13" rx="2"/><path d="M3 10h18"/>',
  cart: '<circle cx="9" cy="20" r="1.5"/><circle cx="17" cy="20" r="1.5"/><path d="M3 4h2l2.4 11h11L21 8H6.2"/>',
  back: '<path d="M15 5l-7 7 7 7"/>', plus: '<path d="M12 5v14M5 12h14"/>', chev: '<path d="M9 5l7 7-7 7"/>',
  search: '<circle cx="11" cy="11" r="7"/><path d="M20 20l-4-4"/>', img: '<rect x="3" y="5" width="18" height="14" rx="2"/><circle cx="9" cy="10" r="2"/><path d="M21 16l-5-5-8 8"/>',
  x: '<path d="M6 6l12 12M18 6L6 18"/>',
  check2: '<path d="M9 11l3 3 8-8"/><path d="M20 12v7a2 2 0 0 1-2 2H6a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11"/>',
  inbox: '<path d="M22 12h-6l-2 3h-4l-2-3H2"/><path d="M5.5 5h13l3.5 7v6a2 2 0 0 1-2 2H4a2 2 0 0 1-2-2v-6z"/>',
  truck: '<path d="M1 4h14v11H1zM15 8h4l4 4v3h-8"/><circle cx="6" cy="18" r="2"/><circle cx="18" cy="18" r="2"/>',
  clock: '<circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/>', check: '<path d="M5 12l5 5 9-10"/>', users: '<circle cx="9" cy="8" r="3.5"/><path d="M2.5 20c.8-3.5 3.4-5.5 6.5-5.5s5.7 2 6.5 5.5M16 4.5a3.5 3.5 0 0 1 0 7M18 14.6c1.8.7 3 2.6 3.5 5.4"/>'
};
const ic = (n, c = "currentColor", w = 18) => `<svg width="${w}" height="${w}" viewBox="0 0 24 24" fill="none" stroke="${c}" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">${ICON[n]}</svg>`;

async function api(action, extra = {}) {
  const r = await fetch(API, { method: "POST", headers: { "Content-Type": "application/json" },
    body: JSON.stringify({ initData: tg ? tg.initData : "", action, dealerId: S.dealerId, ...extra }) });
  const j = await r.json().catch(() => ({ error: "network" }));
  if (!r.ok) throw Object.assign(new Error(j.error || "error"), { status: r.status });
  return j;
}

// ---------- расчёты ----------
function oldDebtSince(d) {
  const paid = Number(d.summary.paid || 0);
  const term = Number(d.dealer.payment_term_days || 30);
  let cum = 0;
  for (const r of d.statement) { if (r.kind === "payment") continue; cum += Number(r.amount); if (cum > paid && daysAgo(r.op_date) > term) return r.op_date; }
  return null;
}

// ---------- экраны ----------
function render() {
  const v = S.view;
  if (v === "ship") { renderOrder(); renderNav(); setBack(); return }
  if (v === "done") { renderDone(); renderNav(); setBack(); return }
  if (v === "apay") { renderAPay(); renderNav(); setBack(); return }
  if (v.startsWith("s_")) { renderStaff(); renderNav(); setBack(); window.scrollTo(0, 0); return }
  if (v === "home") renderHome();
  else if (v === "acts") renderActs();
  else if (v === "act") renderAct();
  else if (v === "pays") renderPays();
  else if (v === "pay") renderPay();
  else if (v === "order") renderOrder();
  else if (v === "done") renderDone();
  renderNav();
  setBack();
  window.scrollTo(0, 0);
}
function go(v, extra = {}) { Object.assign(S, extra); S.view = v; haptic(); render(); }
function setBack() {
  if (!tg) return;
  const sub = ["act", "pay", "done", "apay", "ship", "s_acc"].includes(S.view) || (S.staff && S.dealerId && S.view === "home");
  if (sub) tg.BackButton.show(); else tg.BackButton.hide();
}
function onBack() {
  if (closeZoom()) return;
  if (S.view === "act") return go("acts");
  if (["pay", "apay"].includes(S.view)) return go("home");
  if (S.view === "ship" || S.view === "done") return S.dealerId && S.data ? go("home") : go(S.staff === "ops" ? "s_orders" : "s_dealers");
  if (S.view === "s_acc") return toStaff("s_dealers");
  if (S.staff && S.dealerId) return S.data && (S.data.accounts || []).length > 1 && S.accGroup ? toStaff("s_acc") : toStaff("s_dealers");
}
function toStaff(v) { S.dealerId = null; S.data = null; if (v !== "s_acc") S.accGroup = null; go(v) }
const readonly = () => !!S.staff;

function renderNav() {
  const n = $("#nav");
  if (S.staff && (S.view.startsWith("s_") || !S.dealerId)) {
    n.hidden = false;
    const c = S.counts || {};
    const tabs = S.staff === "owner"
      ? [["s_dealers", "users", "Дилеры", 0], ["s_check", "check2", "Проверка", (c.payments || 0) + (c.acts || 0)], ["s_orders", "inbox", "Заказы", c.orders || 0], ["s_shipsel", "truck", "Отгрузка", 0]]
      : [["s_orders", "inbox", "Заказы", c.orders || 0], ["s_shipsel", "truck", "Отгрузка", 0]];
    n.style.gridTemplateColumns = `repeat(${tabs.length},1fr)`;
    const cur = S.view === "ship" ? "s_shipsel" : S.view === "s_acc" ? "s_dealers" : S.view;
    n.innerHTML = tabs.map(([k, i, t, b]) => `<button data-tab="${k}" class="${cur === k ? "on" : ""}">${b ? `<span class="bd">${b}</span>` : ""}${ic(i, "currentColor", 22)}${t}</button>`).join("");
    n.querySelectorAll("button").forEach((b) => b.onclick = () => toStaff(b.dataset.tab));
    return;
  }
  n.style.gridTemplateColumns = "repeat(4,1fr)";
  if (!S.data) { n.hidden = true; return }
  n.hidden = false;
  const tabs = [["home", "home", "Главная"], ["acts", "box", "Отгрузки"], ["pays", "card", "Оплаты"]];
  if (!readonly()) tabs.push(["order", "cart", "Заказ"]); else tabs.push(["back", "users", "Дилеры"]);
  const cur = S.view === "act" ? "acts" : S.view === "pay" ? "pays" : S.view;
  n.innerHTML = tabs.map(([k, i, t]) => `<button data-tab="${k}" class="${cur === k ? "on" : ""}" ${cur === k ? 'aria-current="page"' : ""}>${ic(i, "currentColor", 22)}${t}</button>`).join("");
  n.querySelectorAll("button").forEach((b) => b.onclick = () => { if (b.dataset.tab === "back") toStaff("s_dealers"); else go(b.dataset.tab) });
}

function renderHome() {
  const d = S.data, s = d.summary;
  const bal = Number(s.balance || 0), lim = Number(s.credit_limit || d.dealer.credit_limit || 0);
  const pct = lim ? Math.min(100, (Math.max(bal, 0) / lim) * 100) : 0;
  const since = Number(s.old_debt) > 0 ? oldDebtSince(d) : null;
  const pend = d.payments.filter((p) => p.status === "pending");
  let rows = [...d.statement].reverse();
  const lim2 = { d30: 30, d90: 90 }[S.period];
  if (lim2) rows = rows.filter((r) => daysAgo(r.op_date) <= lim2);
  const pendRows = pend.filter((p) => !lim2 || daysAgo(p.paid_at) <= lim2);
  $("#app").innerHTML = `
  ${readonly() ? `<div class="banner">Кабинет дилера глазами администратора</div>` : ""}
  <header class="top"><small>КАБИНЕТ ДИЛЕРА</small><div class="h">${esc(d.dealer.name)}</div>
    ${(d.accounts || []).length > 1 ? `<div role="tablist" aria-label="Счёт" style="display:flex;gap:6px;margin-top:14px">${d.accounts.map((a) => `<button role="tab" aria-selected="${a.id === d.dealer.id}" data-acc="${a.id}" style="height:36px;padding:0 14px;border-radius:12px;font-weight:600;font-size:13px;border:1px solid ${a.id === d.dealer.id ? "#fff" : "#3A4A63"};background:${a.id === d.dealer.id ? "#fff" : "transparent"};color:${a.id === d.dealer.id ? "#111F32" : "#fff"}">${esc(a.account_label || "Основной")}</button>`).join("")}</div>` : ""}</header>
  <main class="wrap lift">
    <section class="debt" aria-label="Текущий долг">

function confirmBox(text) {
  return new Promise((res) => { try { tg.showConfirm(text, (ok) => res(!!ok)) } catch (e) { res(window.confirm(text)) } });
}
function shrink(file) {
  return new Promise((res, rej) => {
    const img = new Image(), url = URL.createObjectURL(file);
    img.onload = () => { const k = Math.min(1, 1600 / Math.max(img.width, img.height)); const c = document.createElement("canvas");
      c.width = Math.round(img.width * k); c.height = Math.round(img.height * k); c.getContext("2d").drawImage(img, 0, 0, c.width, c.height);
      URL.revokeObjectURL(url); res(c.toDataURL("image/jpeg", 0.82)) };
    img.onerror = rej; img.src = url;
  });
}

const DOWN = '<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#111F32" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" style="flex-shrink:0"><path d="M6 9l6 6 6-6"/></svg>';
function openSheet(title, opts, cur, count, pick) {
  const bg = document.createElement("div"); bg.className = "sheet-bg";
  bg.innerHTML = `<div class="sheet" role="dialog" aria-label="${esc(title)}"><h2 class="h" style="font-size:26px;margin:0 4px 8px">${esc(title)}</h2>
    ${opts.map((o) => { const n = count(o); return `<button class="opt ${cur === o ? "on" : ""}" data-o="${esc(o)}" ${n ? "" : 'style="opacity:.4"'}><span>${esc(o)}</span><span class="muted sm">${n}</span></button>` }).join("")}</div>`;
  bg.onclick = (e) => { if (e.target === bg) bg.remove() };
  document.body.appendChild(bg);
  bg.querySelectorAll("[data-o]").forEach((b) => b.onclick = () => { bg.remove(); haptic(); pick(b.dataset.o) });

const CART = () => S.view === "ship" ? S.ship.cart : S.cart;
function drawList() {
  const C = CART();
  const toks = S.q.toLowerCase().replace(/ё/g, "е").split(/\s+/).filter(Boolean);
  const list = S.catalog.filter((p) => (S.cat === "Все" || p.category === S.cat) && (S.brand === "Все" || p.brand === S.brand) &&
    toks.every((t) => `${p.name} ${p.size} ${p.brand} ${p.id}`.toLowerCase().replace(/ё/g, "е").includes(t)));
  $("#plist").innerHTML = list.length ? list.slice(0, 120).map((p) => { const q = C[p.id] || 0; return `
    <div class="prod"><img class="thumb zoomable" src="img/${p.id}.jpg" alt="Фото: ${esc(p.name)}" loading="lazy" data-zoom="${p.id}" role="button" tabindex="0" onerror="this.style.visibility='hidden'"><div style="flex:1;min-width:0;display:flex;flex-direction:column;gap:3px">
      <span class="br">${esc(p.brand)} · №${p.id}</span><span class="nm">${esc(p.name)}</span><span class="pr">${esc(p.size)} · ${p.regular_price && Number(p.regular_price) > Number(p.price) ? `<s>${money(p.regular_price)}</s> <b style="color:#C8102E">${money(p.price)} сум</b> <span class="pill" style="background:#FDE7E6;color:#8C1D18;padding:2px 7px;font-size:11px">Акция</span>` : `${money(p.price)} сум`}</span></div>
      ${q ? `<div class="step"><button data-dec="${p.id}" aria-label="Меньше">−</button><input data-q="${p.id}" type="text" inputmode="numeric" pattern="[0-9]*" enterkeyhint="done" autocomplete="off" value="${q}" aria-label="Количество"><button data-inc="${p.id}" aria-label="Больше">+</button></div>`
          : `<button class="add" data-inc="${p.id}" aria-label="Добавить ${esc(p.name)}">${ic("plus", "#111F32")}</button>`}</div>` }).join("") + (list.length > 120 ? `<p class="sm muted" style="text-align:center">Показаны первые 120 — уточните поиск</p>` : "")
    : `<div class="card muted">Ничего не найдено</div>`;
  const setQ = (id, v) => { v = Math.max(0, Math.min(9999, v | 0)); if (v) C[id] = v; else delete C[id]; if (C === S.cart) saveCart(); haptic(); drawList() };
  document.querySelectorAll("[data-inc]").forEach((b) => b.onclick = () => setQ(b.dataset.inc, (C[b.dataset.inc] || 0) + 1));
  document.querySelectorAll("[data-dec]").forEach((b) => b.onclick = () => setQ(b.dataset.dec, (C[b.dataset.dec] || 0) - 1));
  document.querySelectorAll("[data-q]").forEach((i) => {
    const id = i.dataset.q;
    // выделяем число, чтобы новое значение сразу заменяло старое
    i.onfocus = () => setTimeout(() => { try { i.select() } catch (e) {} }, 0);
    i.oninput = () => { const v = i.value.replace(/\D/g, "").slice(0, 4); if (i.value !== v) i.value = v; const n = Number(v); if (n > 0) C[id] = n };
    i.onkeydown = (e) => { if (e.key === "Enter") { e.preventDefault(); i.blur() } };
    i.onblur = () => setQ(id, Number(i.value.replace(/\D/g, "")) || 0);
  });
  drawCart();
}
function drawCart() {
  if (S.view === "ship") return drawShipCart();
  const ids = Object.keys(S.cart).filter((id) => S.catalog.some((p) => p.id == id));
  const bar = $("#cartbar");
  if (!ids.length) { bar.innerHTML = ""; return }
  let sum = 0, units = 0; ids.forEach((id) => { const p = S.catalog.find((x) => x.id == id); sum += p.price * S.cart[id]; units += S.cart[id] });
  const after = Number(S.data.summary.balance || 0) + sum, lim = Number(S.data.summary.credit_limit || 1);
  bar.innerHTML = `<section class="cart" aria-label="Итог заказа">
    <div style="display:flex;justify-content:space-between;align-items:baseline"><span class="sm muted">${ids.length} поз. · ${units} шт · <button id="clr" style="border:none;background:none;color:var(--navy);font-weight:600;padding:0">очистить</button></span><span class="num" style="font-size:28px">${money(sum)} сум</span></div>
    <span class="sm" style="color:${after > lim ? "var(--bad)" : "#3B4352"}">После отгрузки долг составит ${money(after)} сум · ${String(Math.round(after / lim * 1000) / 10).replace(".", ",")}% лимита</span>
    <button class="btn btn-navy" id="sendOrder">Отправить заявку</button></section>`;
  $("#clr").onclick = async () => { if (!(await confirmBox("Очистить корзину?"))) return; S.cart = {}; saveCart(); drawList() };
  $("#sendOrder").onclick = async () => {
    const acc = S.data.dealer.account_label && (S.data.accounts || []).length > 1 ? ` по счёту «${S.data.dealer.account_label}»` : "";
    if (!(await confirmBox(`Отправить заявку${acc}: ${ids.length} поз., ${units} шт на ${money(sum)} сум?`))) return;
    const b = $("#sendOrder"); b.disabled = true; b.textContent = "Отправляем…";
    try {
      const r = await api("order", { items: ids.map((id) => ({ product_id: Number(id), qty: S.cart[id] })) });
      try { tg.HapticFeedback.notificationOccurred("success") } catch (e) {}
      S.cart = {}; saveCart();
      S.doneMsg = { title: "Заявка отправлена", text: `${ids.length} поз. на ${money(r.total)} сум по прайсу.<br>Менеджер OMNIS подтвердит заказ и оформит отгрузку — акт придёт сюда и в Telegram.`, link: "home", linkText: "На главную" };
      go("done");
    } catch (e) { b.disabled = false; b.textContent = "Отправить заявку"; try { tg.showAlert("Не удалось отправить заявку. Попробуйте ещё раз.") } catch (x) {} }
  };
}

    if (!(await confirmBox("Отклонить акт? В долг он не попадёт, сотрудник получит уведомление."))) return;
    try { await api("s_act_review", { actId: b.dataset.ano, ok: false }); renderCheck() } catch (e) { alertBox(e.status === 409 ? "Этот акт уже обработан." : "Не получилось."); renderCheck() }
  });
}

async function renderOrders() {
  loading(); refreshCounts();
  let r; try { r = await api("s_orders") } catch (e) { $("#app").innerHTML = errBox("Не удалось загрузить заказы."); return }
  const pm = new Map(r.products.map((p) => [p.id, p]));
  $("#app").innerHTML = `
  <header class="page-h"><h1 class="h">Заказы</h1><p>Новые заявки дилеров · ${r.orders.length}</p></header>
  <main class="wrap" style="padding-top:8px">
    ${r.orders.length ? r.orders.map((o) => { const its = (o.items || []).filter((i) => pm.has(i.product_id)); const sum = its.reduce((a, i) => a + pm.get(i.product_id).price * i.qty, 0); return `
    <section class="card" style="display:flex;flex-direction:column;gap:8px">
      <div style="display:flex;justify-content:space-between;gap:10px"><div><div style="font-weight:600">${dn(o.dealers)}</div><div class="sm muted">${esc(o.dealers?.city || "")} · ${timeTxt(o.created_at)}</div></div>${its.length ? `<span class="num" style="font-size:24px;white-space:nowrap">${money(sum)}</span>` : ""}</div>
      ${its.length ? its.map((i) => { const p = pm.get(i.product_id); return `<div class="item" style="padding:7px 0"><div style="display:flex;gap:8px;align-items:center;min-width:0"><img class="thumb sm zoomable" src="img/${p.id}.jpg" alt="Фото: ${esc(p.name)}" loading="lazy" data-zoom="${p.id}" role="button" tabindex="0" onerror="this.style.visibility='hidden'"><div><div class="n" style="font-size:13px">${esc(p.name)}</div><div class="d">${esc(p.size)} · ${i.qty} шт</div></div></div></div>` }).join("") : ""}
      ${o.text && its.length < (o.text.split("\n").filter(Boolean).length) ? `<div class="sm" style="background:var(--light);border-radius:10px;padding:8px 10px;white-space:pre-line">${esc(o.text)}</div>` : ""}
      <div class="grid2"><button class="btn btn-dark" style="height:46px" data-ship="${o.id}">Оформить отгрузку</button><button class="btn btn-light" style="height:46px" data-ox="${o.id}">Отменить</button></div>
    </section>` }).join("") : `<div class="card muted">Новых заказов нет.</div>`}
  </main>`;
  document.querySelectorAll("[data-ship]").forEach((b) => b.onclick = async () => {
    const o = r.orders.find((x) => x.id === b.dataset.ship);
    if (!S.catalog) { try { S.catalog = (await api("catalog")).products } catch (e) { return alertBox("Не удалось загрузить каталог.") } }
    const cart = {}; (o.items || []).forEach((i) => { cart[i.product_id] = (cart[i.product_id] || 0) + i.qty });
    startShip({ id: o.dealer_id, name: o.dealers?.name, account_label: o.dealers?.account_label }, o.id, cart);
  });
  document.querySelectorAll("[data-ox]").forEach((b) => b.onclick = async () => {
    if (!(await confirmBox("Отменить этот заказ? Дилер получит уведомление об отмене."))) return;
    try { await api("s_order_cancel", { orderId: b.dataset.ox }); renderOrders() } catch (e) { alertBox(e.status === 409 ? "Заказ уже обработан." : "Не получилось."); renderOrders() }
  });
}

function renderDone() {
  const m = S.doneMsg || {};
  $("#app").innerHTML = `<main class="center">
    <div style="width:72px;height:72px;border-radius:36px;background:var(--waitbg);display:flex;align-items:center;justify-content:center">${ic("check", "#7A4F00", 34)}</div>
    <h1 class="h" style="font-size:34px">${esc(m.title)}</h1><p style="margin:0;line-height:1.5;color:#3B4352">${m.text || ""}</p>
    <button class="btn btn-dark" id="dl">${esc(m.linkText || "На главную")}</button></main>`;
  $("#dl").onclick = () => { const l = m.link || "home"; if (l.startsWith("s_")) toStaff(l); else go(l) };
}

const accStyle = (l) => l === "Наличка" ? "background:#E3F3EA;color:#1F6B44" : l === "Перечисление" ? "background:#E4ECF7;color:#193E75" : "background:var(--light);color:var(--dark)";
const gsum = (g, k = "balance") => g.reduce((a, d) => a + Number(d.summary[k] || 0), 0);
function groupDealers(ds) {
  const gm = new Map(); ds.forEach((d) => { const k = d.group_id || d.id; if (!gm.has(k)) gm.set(k, []); gm.get(k).push(d) });
  return [...gm.values()].sort((a, b) => (a[0].is_test - b[0].is_test) || (gsum(b) - gsum(a)));
}
async function openDealer(id) {
  S.dealerId = id; loading();
  try { S.data = await api("dealer"); S.view = "home"; render() } catch (e) { $("#app").innerHTML = errBox("Не удалось открыть дилера.") }
}
function renderAdmin() {
  refreshCounts();
  const ds = S.adminDealers || [];
  const real = ds.filter((d) => !d.is_test);
  const groups = groupDealers(ds);
  const row = (g) => {
    const d = g[0], multi = g.length > 1;
    const days = Math.max(...g.map((x) => x.summary.days_without_payment ?? -1));
    const old = gsum(g, "old_debt");
    return `<button class="act" data-g="${esc(d.group_id || d.id)}">
      <div style="flex:1;min-width:0;display:flex;flex-direction:column;gap:3px">
        <span style="font-size:15px;font-weight:600">${esc(d.name)}${d.is_test ? ' <span class="sm muted">(тест)</span>' : ""}</span>
        <span class="sm muted">${esc(d.city || "")}${multi ? ` · ${g.length} счёта` : ""}${days >= 0 ? " · без оплаты " + days + " дн." : ""}</span>
        ${old > 0 ? `<span class="sm" style="color:var(--bad);font-weight:600">старый долг ${money(old)}</span>` : ""}</div>
      <span class="num" style="font-size:24px;white-space:nowrap">${money(gsum(g))}</span>${ic("chev", "#8992A3", 16)}</button>`;
  };
  $("#app").innerHTML = `
  <header class="top" style="padding-bottom:76px"><small>OMNIS · АДМИНИСТРАТОР</small><div class="h">Долги дилеров</div></header>
  <main class="wrap lift">
    <section class="debt"><div class="grid2">
      <div><div class="lbl">Общий долг</div><div class="num" style="font-size:34px">${money(gsum(real))}</div></div>
      <div><div class="lbl">Старый &gt;30 дн.</div><div class="num" style="font-size:34px">${money(gsum(real, "old_debt"))}</div></div></div></section>
    ${groups.map(row).join("")}
    <p class="sm muted" style="text-align:center">Нажмите на дилера: его кабинет, внесение оплаты и новая отгрузка.${ds.some((d) => d.is_test) ? " Тестовые дилеры в общий долг не входят." : ""}</p>
  </main>`;
  document.querySelectorAll("[data-g]").forEach((b) => b.onclick = () => {
    const g = groups.find((x) => (x[0].group_id || x[0].id) === b.dataset.g);
    if (g.length === 1) return openDealer(g[0].id);
    S.accGroup = g; go("s_acc");
  });
}
function renderAccPick() {
  const g = S.accGroup || [];
  if (!g.length) return toStaff("s_dealers");
  const d0 = g[0];
  $("#app").innerHTML = `
  <div class="back"><button id="bk" aria-label="Назад к дилерам">${ic("back", "#111F32", 22)}</button><h1 class="h" style="font-size:32px">${esc(d0.name)}</h1></div>
  <main class="wrap" style="padding-top:8px">
    <section class="debt" style="padding:16px 20px;gap:4px"><span class="lbl">${esc(d0.city || "")} · общий долг по ${g.length} счетам</span><span class="num" style="font-size:40px;line-height:1">${money(gsum(g))}</span></section>
    <p class="sm muted" style="margin:4px 4px 0">Выберите счёт:</p>
    ${g.map((d) => `<button class="act" data-d="${d.id}" style="padding:16px">
      <div style="flex:1;min-width:0;display:flex;flex-direction:column;gap:6px">
        <span class="pill" style="align-self:flex-start;font-size:14px;padding:6px 12px;${accStyle(d.account_label)}">${esc(d.account_label || "Основной")}</span>
        <span class="sm muted">${d.summary.days_without_payment != null ? "без оплаты " + d.summary.days_without_payment + " дн." : "оплат ещё не было"}${Number(d.summary.old_debt) > 0 ? ` · <b style="color:var(--bad)">старый ${money(d.summary.old_debt)}</b>` : ""}</span></div>
      <span class="num" style="font-size:26px;white-space:nowrap">${money(d.summary.balance)}</span>${ic("chev", "#8992A3", 16)}</button>`).join("")}
  </main>`;
  $("#bk").onclick = () => toStaff("s_dealers");
  document.querySelectorAll("[data-d]").forEach((b) => b.onclick = () => openDealer(b.dataset.d));
}

const errBox = (t) => `<div class="center"><h1 class="h" style="font-size:30px">Ошибка</h1><p class="muted" style="margin:0">${esc(t)}</p><button class="btn btn-dark" onclick="location.reload()">Обновить</button></div>`;
async function reload() { S.data = await api("dealer") }

// ---------- клавиатура: прячем нижние панели, закрываем касанием вне поля ----------
const isField = (el) => el && (el.tagName === "INPUT" || el.tagName === "TEXTAREA") && el.type !== "file";
// Клавиатура: нижние панели прячем, только пока клавиатура реально открыта (по высоте экрана),
// а не просто пока поле в фокусе. Если клавиатуру закрыли кнопкой «назад»/«скрыть» — снимаем фокус,
// количество сохраняется, корзина и меню возвращаются.
let KB_MAX = 0, KB_OPEN = false;
const vpH = () => Math.round((window.visualViewport && window.visualViewport.height) || window.innerHeight);
function kbCheck() {
  const h = vpH();
  if (!isField(document.activeElement)) KB_MAX = Math.max(KB_MAX, h);
  const open = isField(document.activeElement) && KB_MAX > 0 && h < KB_MAX - 120;
  if (KB_OPEN && !open && isField(document.activeElement)) document.activeElement.blur();
  KB_OPEN = open;
  document.body.classList.toggle("kb", open);
}
KB_MAX = vpH();
if (window.visualViewport) window.visualViewport.addEventListener("resize", kbCheck);
window.addEventListener("resize", kbCheck);
try { window.Telegram.WebApp.onEvent("viewportChanged", kbCheck) } catch (e) {}
document.addEventListener("focusin", () => setTimeout(kbCheck, 350));
document.addEventListener("focusout", () => setTimeout(kbCheck, 80));
const tapOutside = (e) => {
  const a = document.activeElement;
  if (!isField(a)) return;
  if (isField(e.target) || (e.target.closest && e.target.closest("label"))) return;
  a.blur();
};
document.addEventListener("touchstart", tapOutside, { capture: true, passive: true });
document.addEventListener("mousedown", tapOutside, true);

// ---------- увеличение фото ----------
let LB = null;
function openZoom(id, img) {
  closeZoom(true);
  const p = (S.catalog || []).find((x) => x.id == id);
  const name = p ? p.name : (img.alt || "").replace(/^Фото: /, "");
  const el = document.createElement("div");
  el.className = "lb"; el.setAttribute("role", "dialog"); el.setAttribute("aria-label", "Фото товара");
  el.innerHTML = `<button class="x" aria-label="Закрыть">${ic("x", "#fff", 22)}</button>
    <img src="${img.currentSrc || img.src}" alt="${esc(name)}">
    <div class="cap"><b>${esc(name)}</b>${p ? `<span>${esc(p.brand)} · ${esc(p.size)} · ${money(p.price)} сум</span>` : ""}</div>
    <div class="hint">Нажмите в любом месте, чтобы закрыть</div>`;
  el.onclick = () => closeZoom();
  document.body.appendChild(el);
  LB = el; haptic();
  try { tg.BackButton.show() } catch (e) {}
}
function closeZoom(silent) {
  if (!LB) return false;
  LB.remove(); LB = null;
  if (!silent) setBack();
  return true;
}
document.addEventListener("click", (e) => { const t = e.target.closest && e.target.closest("[data-zoom]"); if (t) { e.preventDefault(); e.stopPropagation(); openZoom(t.dataset.zoom, t) } }, true);
document.addEventListener("keydown", (e) => {
  if (e.key === "Escape" && LB) closeZoom();
  const t = e.target.closest && e.target.closest("[data-zoom]");
  if (t && (e.key === "Enter" || e.key === " ")) { e.preventDefault(); openZoom(t.dataset.zoom, t) }
});

async function boot() {
  if (tg) { tg.ready(); tg.expand(); try { tg.setHeaderColor("#111F32"); tg.setBackgroundColor("#ECECEC") } catch (e) {} tg.BackButton.onClick(onBack) }
  if (!tg || !tg.initData) { $("#app").innerHTML = `<div class="center"><h1 class="h" style="font-size:30px">Откройте через Telegram</h1><p class="muted" style="margin:0">Кабинет дилера работает внутри бота @omnis_dealers_bot.</p></div>`; return }
  try {
    const r = await api("init");
    S.role = r.role;
    if (r.role === "admin") { S.staff = "owner"; S.adminDealers = r.dealers; S.dealersFresh = true; S.view = "s_dealers"; render(); return }
    if (r.role === "ops") { S.staff = "ops"; S.view = "s_orders"; render(); return }
    if (r.role !== "dealer") { $("#app").innerHTML = `<div class="center"><h1 class="h" style="font-size:30px">Нет доступа</h1><p class="muted" style="margin:0">Чтобы подключиться, попросите у менеджера OMNIS ссылку-приглашение и откройте её в Telegram.</p></div>`; return }
    S.data = r; S.dealerId = r.dealer.id; render();
  } catch (e) { $("#app").innerHTML = errBox(e.status === 401 ? "Сессия устарела. Закройте и снова откройте приложение." : "Не удалось загрузить данные.") }
}
boot();
</script>
